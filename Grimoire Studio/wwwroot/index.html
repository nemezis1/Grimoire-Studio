<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grimoire Studio</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="css/app#[.{fingerprint}].css" />
    <script>
        // The theme picked with the header switch, set before the page draws so it does not flash the other one.
        window.grimoireTheme = {
            key: 'grimoire-studio.theme',
            current() {
                return document.documentElement.dataset.theme
                    ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            },
            set(theme) {
                document.documentElement.dataset.theme = theme;
                try { localStorage.setItem(grimoireTheme.key, theme); } catch { }
            },
        };
        try {
            const theme = localStorage.getItem(grimoireTheme.key);
            if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        } catch { }
    </script>
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="Grimoire Studio.styles.css" rel="stylesheet" /> -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Wystąpił nieoczekiwany błąd.
        <a href="." class="reload">Odśwież stronę</a>
        <span class="dismiss" title="Zamknij">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <!-- Imported through the import map, so each version of the file gets its own address and no stale copy is used. -->
    <script type="module">import "./js/fold.js";</script>
</body>

</html>
