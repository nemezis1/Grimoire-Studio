# Cloudflare Worker that commits approved wiki changes to the repository (see README.md).
name = "grimoire-studio"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
REPOSITORY = "nemezis1/Grimoire-Studio"
BRANCH = "main"
COMMIT_EMAIL = "grzegorz1992@o2.pl"
ALLOWED_ORIGINS = "https://nemezis1.github.io,http://localhost:5126"

# Secrets, set with `npx wrangler secret put <NAME>` (never in this file):
#   GITHUB_TOKEN  fine-grained token: repository nemezis1/Grimoire-Studio, Contents read & write
#   ADMIN_KEYS    JSON {"<admin name>": "<sha-256 hex>"}; add-admin.mjs prints an entry
