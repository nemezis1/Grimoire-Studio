# Cloudflare Worker serving the site and, under /api/, the publishing service (see README.md).
# The Build workflow deploys it on every push to main; the site files are the published app.
name = "grimoire-studio"
main = "src/index.js"
compatibility_date = "2026-10-01"

[assets]
# Built by: dotnet publish "Grimoire Studio/Grimoire Studio.csproj" -c Release -o publish
directory = "../publish/wwwroot"
binding = "ASSETS"
# Paths that are not files are app routes (/roles/chef): they get index.html.
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
REPOSITORY = "nemezis1/Grimoire-Studio"
BRANCH = "main"
COMMIT_EMAIL = "grzegorz1992@o2.pl"
ALLOWED_ORIGINS = "http://localhost:5126"

# Secrets, set with `npx wrangler secret put <NAME>` (never in this file):
#   GITHUB_TOKEN  fine-grained token: repository nemezis1/Grimoire-Studio, Contents read & write
#   ADMIN_KEYS    JSON {"<admin name>": "<sha-256 hex>"}; add-admin.mjs prints an entry
