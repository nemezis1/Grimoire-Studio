# Every push and pull request: build and test (the tests also validate the data folder).
# Pushes to main are then published to GitHub Pages.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request builds stop; a deployment from main is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test "Grimoire Studio.slnx" --configuration Release

      - name: Publish
        run: dotnet publish "Grimoire Studio/Grimoire Studio.csproj" --configuration Release --output publish

      # The site lives under /<repository>/; the data version is the commit; Pages does not use the precompressed
      # .br/.gz copies (and they would hold the old index.html); 404.html serves the app for deep links like
      # /roles/chef; .nojekyll keeps the _framework folder.
      - name: Prepare for GitHub Pages
        run: |
          site=publish/wwwroot
          sed -i "s|<base href=\"/\" />|<base href=\"/${GITHUB_REPOSITORY#*/}/\" />|" "$site/index.html"
          echo "${GITHUB_SHA::7}" > "$site/data/version.txt"
          find "$site" \( -name "*.br" -o -name "*.gz" \) -delete
          cp "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
