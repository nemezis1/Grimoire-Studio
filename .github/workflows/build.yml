# Every push and pull request: build and test (the tests also validate the data folder).
# Pushes to main are then deployed to Cloudflare Workers: the site and the publishing service (worker/).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request builds stop; a deployment from main is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test "Grimoire Studio.slnx" --configuration Release

      - name: Test publishing Worker
        working-directory: worker
        run: node --test

      - name: Publish
        run: dotnet publish "Grimoire Studio/Grimoire Studio.csproj" --configuration Release --output publish

      # The data version is the commit. Workers serves the files as they are, so the precompressed .br/.gz copies are
      # left out.
      - name: Prepare the site
        run: |
          site=publish/wwwroot
          echo "${GITHUB_SHA::7}" > "$site/data/version.txt"
          find "$site" \( -name "*.br" -o -name "*.gz" \) -delete

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
